# C.O.R.E — central config
# Version: v0.3 (Section 2 AMENDMENT — source strategy revised after live Colab test showed
# yfinance fully blocked, 0/14. See docs/data_sources.md Section 2 Amendment for full rationale.)

project:
  name: "core-market"
  description: "C.O.R.E — Central Organizer for Relaying Explanations"
  timezone: "Asia/Kolkata"

paths:
  data_raw: "data/raw"
  data_macro: "data/macro"
  data_processed: "data/processed"
  models_saved: "models_saved"
  notebooks: "notebooks"
  docs: "docs"
  handoffs: "docs/handoffs"

date_range:
  start: "2015-01-01"
  end: null

# ---------------------------------------------------------------------------
# UNIVERSE — source field per instrument now reflects the amended strategy.
# See docs/data_sources.md for full rationale on the NSE Bhavcopy pivot.
# ---------------------------------------------------------------------------
universe:

  indices:
    nifty50:      { symbol: "^NSEI",    primary_source: "nse_index_report", secondary_source: "yfinance", status: "endpoint_tbd_section3" }
    sensex:       { symbol: "^BSESN",   primary_source: "nse_index_report", secondary_source: "yfinance", status: "endpoint_tbd_section3" }
    nifty_bank:   { symbol: "^NSEBANK", primary_source: "nse_index_report", secondary_source: "yfinance", status: "endpoint_tbd_section3" }
    nifty_next50: { symbol: "^NSEMDCP50", primary_source: "nse_index_report", secondary_source: "yfinance", status: "unverified" }

  stocks:
    # Source: NSE Bhavcopy (UDiFF format), one file per trading day covers the whole list.
    # https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{YYYYMMDD}_F_0000.csv.zip
    - { ticker: "RELIANCE",   yf_ticker: "RELIANCE.NS",   sector: "energy" }
    - { ticker: "TCS",        yf_ticker: "TCS.NS",        sector: "it" }
    - { ticker: "HDFCBANK",   yf_ticker: "HDFCBANK.NS",   sector: "financials" }
    - { ticker: "ICICIBANK",  yf_ticker: "ICICIBANK.NS",  sector: "financials" }
    - { ticker: "INFY",       yf_ticker: "INFY.NS",       sector: "it" }
    - { ticker: "HINDUNILVR", yf_ticker: "HINDUNILVR.NS", sector: "fmcg" }
    - { ticker: "ITC",        yf_ticker: "ITC.NS",        sector: "fmcg" }
    - { ticker: "SBIN",       yf_ticker: "SBIN.NS",       sector: "financials" }
    - { ticker: "BHARTIARTL", yf_ticker: "BHARTIARTL.NS", sector: "telecom" }
    - { ticker: "KOTAKBANK",  yf_ticker: "KOTAKBANK.NS",  sector: "financials" }
    - { ticker: "LT",         yf_ticker: "LT.NS",         sector: "industrials" }
    - { ticker: "AXISBANK",   yf_ticker: "AXISBANK.NS",   sector: "financials" }
    - { ticker: "BAJFINANCE", yf_ticker: "BAJFINANCE.NS", sector: "financials" }
    - { ticker: "MARUTI",     yf_ticker: "MARUTI.NS",     sector: "auto" }
    - { ticker: "SUNPHARMA",  yf_ticker: "SUNPHARMA.NS",  sector: "pharma" }
    # `ticker` = NSE symbol as it appears in Bhavcopy (primary key going forward).
    # `yf_ticker` kept only for the yfinance secondary-path fallback.

  commodities:
    gold:        { symbol: "GC=F", stooq_symbol: "xauusd", primary_source: "yfinance", fallback_source: "stooq_csv" }
    silver:      { symbol: "SI=F", stooq_symbol: null,      primary_source: "yfinance", fallback_source: "stooq_csv", note: "stooq symbol tbd Section 3" }
    crude_wti:   { symbol: "CL=F", stooq_symbol: "cl.f",    primary_source: "yfinance", fallback_source: "stooq_csv" }
    crude_brent: { symbol: "BZ=F", stooq_symbol: null,      primary_source: "yfinance", fallback_source: "stooq_csv", note: "preferred over WTI for India — Brent-priced imports; stooq symbol tbd" }
    copper:      { symbol: "HG=F", stooq_symbol: null,      primary_source: "yfinance", fallback_source: "stooq_csv", note: "stooq symbol tbd Section 3" }
    nat_gas:     { symbol: "NG=F", stooq_symbol: null,      primary_source: "yfinance", fallback_source: "stooq_csv", note: "stooq symbol tbd Section 3" }

  currency:
    usd_inr: { symbol: "USDINR=X", stooq_symbol: "usdinr", primary_source: "yfinance", fallback_source: "stooq_csv" }

  macro:
    source: "RBI DBIE (manual export)"
    secondary_source: "data.gov.in (per-series check)"
    series:
      - repo_rate
      - cpi_inflation_yoy
      - wpi_inflation_yoy
      - crr
      - slr
      - usd_inr_reference_rate

  calendar_effects:
    source: "computed"
    fno_expiry_rule: "last Thursday of month (NSE convention) — must reconcile against NSE holiday calendar"
    festival_table_path: "config/festival_dates.yaml"

  lunar_phase:
    source: "computed"
    method: "pure astronomical formula, no API/library dependency"

# ---------------------------------------------------------------------------
# Fetch behavior
# ---------------------------------------------------------------------------
fetch:
  batch_size: 5
  delay_between_batches_sec: 2
  max_retries: 4
  backoff_base_sec: 5
  fallback_source_for_indices: "nse_index_report"   # was "stooq" in v0.2 — revised, see amendment
  nse_bhavcopy:
    url_template: "https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{yyyymmdd}_F_0000.csv.zip"
    requires_browser_user_agent: true
    requires_cookie_warmup: true
    warmup_url: "https://www.nseindia.com"
  stooq_csv:
    url_template: "https://stooq.com/q/d/l/?s={symbol}&d1={start}&d2={end}&i=d"
    note: "low daily request quota — use for a handful of fallback series, not bulk pulls"
